[package]
name = "redis-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.5"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5.5"
parking_lot = "0.12"

[dev-dependencies]
# redis = "0.24"  # Removed due to zerocopy compatibility issues

[[bin]]
name = "redis-proxy"
path = "src/main.rs"
